<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Candidate Account — AI Interview Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container-narrow" style="margin-top:40px;">
  <div class="card">
    <div class="eyebrow" style="margin-bottom:4px;">Join Simulator</div>
    <h2>Create Candidate Account</h2>
    <p class="muted" style="font-size:13.5px;margin-bottom:18px;">
      Practice real-time technical interviews with adaptive AI and voice feedback.
    </p>

    <div id="errorBox" class="alert alert-error" style="display:none;margin-bottom:16px;"></div>
    <div id="successBox" class="alert alert-success" style="display:none;margin-bottom:16px;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" minlength="8" placeholder="••••••••" required>
        <div class="form-hint">At least 8 characters.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" minlength="8" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding:12px;">Create Account</button>
    </form>

    <p class="text-center" style="margin-top:16px;font-size:13.5px;">
      Already have an account? <a href="login-candidate.html">Sign in</a><br>
      <a href="index.html" style="font-size:12.5px;display:inline-block;margin-top:8px;">← Return to Home</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const errorBox = document.getElementById("errorBox");
  const successBox = document.getElementById("successBox");
  const submitBtn = document.getElementById("submitBtn");

  if (password !== confirmPassword) {
    errorBox.textContent = "Passwords do not match.";
    errorBox.style.display = "block";
    successBox.style.display = "none";
    return;
  }

  errorBox.style.display = "none";
  successBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Creating your account…";

  try {
    const res = await Api.register(name, email, password);
    const candidateName = (res.user && res.user.name) ? res.user.name : name;
    errorBox.style.display = "none";
    successBox.textContent = `✓ Account created successfully! Welcome, ${candidateName}. Redirecting to dashboard…`;
    successBox.style.display = "block";
    submitBtn.textContent = "✓ Account Created";
    setTimeout(() => {
      window.location.href = "candidate-dashboard.html";
    }, 1200);
  } catch (err) {
    successBox.style.display = "none";
    errorBox.textContent = err.message || "Registration failed. Please check inputs.";
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Create Account";
  }
});
</script>
</body>
</html>
