<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Seeker Login — AI Interview Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container-narrow" style="margin-top:48px;">
  <div class="card">
    <div class="eyebrow" style="margin-bottom:4px;">Candidate Access</div>
    <h2>Job Seeker Login</h2>
    <p class="muted" style="font-size:13.5px;margin-bottom:18px;">
      Sign in to start practice interviews, track progress, and review evaluations.
    </p>

    <div id="errorBox" class="alert alert-error" style="display:none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding:12px;">Sign In</button>
    </form>

    <p class="text-center" style="margin-top:16px;font-size:13.5px;">
      Don't have an account? <a href="register.html">Create free account</a><br>
      <span class="muted" style="font-size:12px;">Are you an administrator? <a href="login-admin.html">Admin Login</a></span><br>
      <a href="index.html" style="font-size:12.5px;display:inline-block;margin-top:8px;">← Return to Home</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");
  errorBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in…";

  try {
    await Api.login(email, password);
    window.location.href = "candidate-dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message || "Invalid credentials. Please retry.";
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
